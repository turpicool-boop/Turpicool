name: Actualizar Precios Diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests

      - name: Generar precios.json
        run: |
          python3 -c "
          import requests, pandas as pd, json, io
          r = requests.get('https://docs.google.com/spreadsheets/d/1RlYJMsZ0uMpEhrOlUG2Y9EF88ZHzR3Sk/export?format=xlsx', timeout=30)
          r.raise_for_status()
          df = pd.read_excel(io.BytesIO(r.content), sheet_name='Lista de Precios', header=10)
          df.columns = ['_','codigo','producto','cantidad','precio_ref','precio_bs']
          df = df[df['codigo'].notna() & (df['codigo'] != 'Codigo') & (df['codigo'] != 'TOTAL')]
          df['precio_ref'] = pd.to_numeric(df['precio_ref'], errors='coerce').round(2)
          precios = {str(x['codigo']).strip(): x['precio_ref'] for _,x in df.iterrows() if pd.notna(x['precio_ref'])}
          json.dump(precios, open('precios.json','w'), indent=2)
          print('OK', len(precios), 'productos')
          "

      - name: Subir precios.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git diff --cached --quiet || git commit -m "Precios actualizados $(date +'%Y-%m-%d')"
          git push
